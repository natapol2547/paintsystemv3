schema_version = "1.0.0"

id = "paint_system"
version = "3.0.0"
name = "Paint System"
tagline = "Layer-based texture painting with channels, masks and filters"
maintainer = "Tawan Sunflower"
type = "add-on"

website = "https://github.com/natapol2547/paintsystemv3"

tags = ["Paint"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2024-2026 Tawan Sunflower",
]

[permissions]
files = "Loading and saving layer images"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/dist/",
  "/*.zip",
  ".gitignore",
  "README.md",
  "*.blend1",
  "/tests/",
  "/docs/",
  "/.claude/",
  "/.venv/",
  "/.ruff_cache/",
  "/.vscode/",
  ".python-version",
  "pyproject.toml",
  "uv.lock",
]
