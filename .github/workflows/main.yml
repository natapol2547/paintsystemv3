# .github/workflows/main.yaml
name: Release

on:
    # pull_request:
    #     branches: ['**']
    workflow_dispatch:
        inputs:
            release_stage:
                type: choice
                description: 'release stage'
                required: True
                default: 'gold'
                options:
                    - alpha
                    - beta
                    - rc
                    - gold

permissions:
    contents: write

jobs:
    make-tests-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'
            - name: Generate test matrix
              id: set-matrix
              run: python .github/make-tests-matrix.py >> $GITHUB_OUTPUT

    Test:
        needs: make-tests-matrix
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.make-tests-matrix.outputs.matrix) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Cache Blender download
              id: blender-cache
              uses: actions/cache@v4
              with:
                  path: blender-${{ matrix.version }}
                  key: blender-${{ runner.os }}-${{ matrix.version }}

            - name: Download and extract Blender
              if: steps.blender-cache.outputs.cache-hit != 'true'
              run: |
                echo "Downloading Blender from ${{ matrix.download_url }}"
                curl -SL --fail -o blender.tar.xz "${{ matrix.download_url }}"
                echo "Download complete. Checking file..."
                ls -lh blender.tar.xz
                file blender.tar.xz
                echo "Extracting Blender..."
                mkdir -p blender-${{ matrix.version }}
                tar -xf blender.tar.xz -C blender-${{ matrix.version }} --strip-components=1
                echo "Extraction complete."

            - name: Run Addon Tests in Blender ${{ matrix.version }}
              run: |
                  BLENDER_EXECUTABLE=./blender-${{ matrix.version }}/blender
                  ADDON_FOLDER_NAME=paint_system

                  echo "Finding user script path for Blender ${{ matrix.version }}"
                  BLENDER_USER_SCRIPTS=$(./blender-${{ matrix.version }}/blender --background --python-expr "import bpy; print(bpy.utils.script_path_user())" | grep '^/')
                  
                  if [ -z "$BLENDER_USER_SCRIPTS" ]; then
                      echo "Error: Could not determine Blender's user script path."
                      exit 1
                  fi

                  ADDON_INSTALL_PATH="$BLENDER_USER_SCRIPTS/addons"
                  echo "Addon will be linked to: $ADDON_INSTALL_PATH"

                  mkdir -p "$ADDON_INSTALL_PATH"
                  ln -s "$GITHUB_WORKSPACE" "$ADDON_INSTALL_PATH/$ADDON_FOLDER_NAME"

                  echo "Running tests with Blender from: $BLENDER_EXECUTABLE"
                  $BLENDER_EXECUTABLE --background --python run_tests.py

    Build:
        runs-on: ubuntu-latest
        needs: Test
        env:
            BLENDER_BUILD_VERSION: '4.2.13'
            BLENDER_DOWNLOAD_URL: 'https://download.blender.org/release/Blender4.2/blender-4.2.13-linux-x64.tar.xz'
        outputs:
            version: ${{ steps.manifest_meta.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Read manifest version and compute release tag
              id: manifest_meta
              env:
                  RELEASE_STAGE: ${{ github.event.inputs.release_stage }}
              run: |
                  python <<'PY' >> "$GITHUB_OUTPUT"
                  import os
                  import tomllib

                  with open("blender_manifest.toml", "rb") as f:
                      data = tomllib.load(f)
                  version = data["version"]
                  stage = os.environ["RELEASE_STAGE"]
                  if stage == "gold":
                      tag = f"v{version}"
                      prerelease = "false"
                  else:
                      tag = f"v{version}_{stage}"
                      prerelease = "true"
                  print(f"version={version}")
                  print(f"tag={tag}")
                  print(f"prerelease={prerelease}")
                  title = f"Paint System {tag}"
                  print(f"release_title={title}")
                  PY

            - name: Cache Blender (build)
              id: blender-build-cache
              uses: actions/cache@v4
              with:
                  path: blender-${{ env.BLENDER_BUILD_VERSION }}
                  key: blender-${{ runner.os }}-${{ env.BLENDER_BUILD_VERSION }}-build

            - name: Download and extract Blender (build)
              if: steps.blender-build-cache.outputs.cache-hit != 'true'
              run: |
                  echo "Downloading Blender from ${{ env.BLENDER_DOWNLOAD_URL }}"
                  curl -SL --fail -o blender.tar.xz "${{ env.BLENDER_DOWNLOAD_URL }}"
                  mkdir -p "blender-${{ env.BLENDER_BUILD_VERSION }}"
                  tar -xf blender.tar.xz -C "blender-${{ env.BLENDER_BUILD_VERSION }}" --strip-components=1

            - name: Validate extension package
              run: |
                  BLENDER="./blender-${{ env.BLENDER_BUILD_VERSION }}/blender"
                  "$BLENDER" --background --command extension validate "$GITHUB_WORKSPACE"

            - name: Build extension package
              run: |
                  BLENDER="./blender-${{ env.BLENDER_BUILD_VERSION }}/blender"
                  mkdir -p dist
                  "$BLENDER" --background --command extension build \
                    --source-dir "$GITHUB_WORKSPACE" \
                    --output-dir dist \
                    --verbose

            - name: Create draft GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="${{ steps.manifest_meta.outputs.tag }}"
                  TITLE="${{ steps.manifest_meta.outputs.release_title }}"
                  PRE="${{ steps.manifest_meta.outputs.prerelease }}"
                  EXTRA=()
                  if [ "$PRE" = "true" ]; then
                    EXTRA+=(--prerelease)
                  fi
                  gh release create "$TAG" dist/*.zip --draft --title "$TITLE" "${EXTRA[@]}"