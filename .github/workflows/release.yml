# Build the extension package and create a draft GitHub release.
# Runs the full test workflow first so a broken build cannot be published.
# The release tag comes from the manifest version; use a pre-release
# suffix there (for example 3.0.0-beta.1) for anything that is not final.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Build and draft release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, validate and draft release
        id: build
        uses: natapol2547/blender-extension-builder@main
        with:
          source-dir: '.'
          strict: 'true'

      - name: Summary
        run: |
          {
            echo "Built ${{ steps.build.outputs.addon-id }} ${{ steps.build.outputs.addon-version }} with Blender ${{ steps.build.outputs.blender-version }}"
            echo "Draft release: ${{ steps.build.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
