[project]
name = "paintsystemv3"
version = "0.1.0"
description = "Paint System v3 development environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fake-bpy-module>=20260314",
    "numpy>=2.4.3",
]

[tool.ruff]
extend-exclude = [".venv", "docs"]
line-length = 120

[tool.ruff.lint]
# Pyflakes only: unused imports/variables, undefined names, redefinitions.
select = ["F"]

[tool.pyright]
typeCheckingMode = "off"
# fake-bpy-module types sockets as the NodeSocket base, so subclass
# attributes like default_value read as unknown.
reportAttributeAccessIssue = false
reportMissingModuleSource = false
reportInvalidTypeForm = false